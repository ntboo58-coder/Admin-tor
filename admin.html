<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset='UTF-8'>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GHOST X PROXY — Admin Panel</title>
<style>
* {
   margin: 0;
   padding: 0;
   box-sizing: border-box;
   font-family: 'Segoe UI', system-ui, sans-serif;
   -webkit-tap-highlight-color: transparent;
}

body {
   background: #050505;
   color: #fff;
   min-height: 100vh;
   padding: 16px;
   background-image: 
      radial-gradient(circle at 20% 10%, rgba(255,31,61,0.08), transparent 45%),
      radial-gradient(circle at 80% 90%, rgba(255,31,61,0.06), transparent 45%);
}

.header {
   text-align: center;
   padding: 18px 12px 22px;
   margin-bottom: 18px;
   border-bottom: 1px solid #1a1a1a;
   position: relative;
}

.header h1 {
   font-size: 22px;
   font-weight: 800;
   letter-spacing: 4px;
   text-transform: uppercase;
   color: #fff;
   text-shadow: 0 0 20px rgba(255,31,61,0.6);
}

.header h1 span {
   color: #ff1f3d;
}

.header p {
   font-size: 11px;
   color: #666;
   letter-spacing: 2px;
   margin-top: 6px;
   text-transform: uppercase;
}

/* Status bar */
.status-bar {
   display: flex;
   align-items: center;
   justify-content: center;
   gap: 8px;
   margin-top: 12px;
   font-size: 11px;
   font-weight: 600;
   letter-spacing: 1px;
}

.status-bar .dot {
   width: 8px;
   height: 8px;
   border-radius: 50%;
   background: #00ff88;
   box-shadow: 0 0 10px #00ff88;
   animation: pulse 1.5s infinite;
}

.status-bar.offline .dot {
   background: #ff1f3d;
   box-shadow: 0 0 10px #ff1f3d;
}

.status-bar span { color: #00ff88; }
.status-bar.offline span { color: #ff1f3d; }

@keyframes pulse {
   0%, 100% { opacity: 1; }
   50% { opacity: 0.4; }
}

/* Form Card */
.card {
   background: #0a0a0a;
   border: 1px solid #1a1a1a;
   border-radius: 16px;
   padding: 16px;
   margin-bottom: 16px;
   box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}

.card-title {
   font-size: 12px;
   font-weight: 700;
   letter-spacing: 2px;
   color: #ff1f3d;
   text-transform: uppercase;
   margin-bottom: 14px;
   display: flex;
   align-items: center;
   gap: 8px;
}

.card-title::before {
   content: '';
   width: 4px;
   height: 14px;
   background: #ff1f3d;
   border-radius: 2px;
   box-shadow: 0 0 10px #ff1f3d;
}

.field {
   margin-bottom: 12px;
}

.field label {
   display: block;
   font-size: 11px;
   color: #888;
   letter-spacing: 1px;
   text-transform: uppercase;
   margin-bottom: 6px;
   font-weight: 600;
}

.field input,
.field select {
   width: 100%;
   height: 46px;
   background: #050505;
   border: 1px solid #1f1f1f;
   border-radius: 10px;
   color: #fff;
   font-size: 14px;
   padding: 0 14px;
   outline: none;
   transition: all 0.2s;
}

.field input:focus,
.field select:focus {
   border-color: #ff1f3d;
   box-shadow: 0 0 0 3px rgba(255,31,61,0.15);
}

.field-row {
   display: grid;
   grid-template-columns: 1fr 1fr;
   gap: 10px;
}

.btn {
   width: 100%;
   height: 48px;
   border: none;
   border-radius: 11px;
   font-size: 14px;
   font-weight: 700;
   letter-spacing: 1.5px;
   text-transform: uppercase;
   cursor: pointer;
   transition: all 0.2s;
   display: flex;
   align-items: center;
   justify-content: center;
   gap: 8px;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
   background: linear-gradient(135deg, #ff1f3d, #d50021);
   color: #fff;
   box-shadow: 0 6px 20px rgba(255,31,61,0.4);
}

.btn-primary:active {
   box-shadow: 0 3px 10px rgba(255,31,61,0.3);
}

.btn-ghost {
   background: #0d0d0d;
   color: #fff;
   border: 1px solid #252525;
}

.btn-ghost:active {
   background: #141414;
   border-color: #333;
}

/* List of buttons */
.list-header {
   display: flex;
   align-items: center;
   justify-content: space-between;
   margin-bottom: 12px;
}

.count-badge {
   background: rgba(255,31,61,0.12);
   color: #ff1f3d;
   font-size: 11px;
   font-weight: 700;
   padding: 4px 10px;
   border-radius: 20px;
   border: 1px solid rgba(255,31,61,0.25);
   letter-spacing: 1px;
}

.item {
   background: #0a0a0a;
   border: 1px solid #1a1a1a;
   border-radius: 12px;
   padding: 14px;
   margin-bottom: 10px;
   transition: all 0.2s;
}

.item.inactive {
   opacity: 0.5;
}

.item-top {
   display: flex;
   align-items: flex-start;
   justify-content: space-between;
   gap: 10px;
   margin-bottom: 10px;
}

.item-info {
   flex: 1;
   min-width: 0;
}

.item-name {
   font-size: 15px;
   font-weight: 600;
   color: #fff;
   margin-bottom: 4px;
   word-break: break-word;
}

.item-meta {
   display: flex;
   flex-wrap: wrap;
   gap: 6px;
   font-size: 10.5px;
   color: #666;
   letter-spacing: 0.5px;
}

.item-meta .tag {
   background: #111;
   padding: 3px 8px;
   border-radius: 5px;
   border: 1px solid #1f1f1f;
   color: #999;
   text-transform: uppercase;
   font-weight: 600;
}

.item-meta .tag.color-tag {
   color: #ff1f3d;
   border-color: rgba(255,31,61,0.3);
   background: rgba(255,31,61,0.08);
}

.item-meta .tag.active-tag {
   color: #00ff88;
   border-color: rgba(0,255,136,0.3);
   background: rgba(0,255,136,0.08);
}

.item-meta .tag.inactive-tag {
   color: #ff1f3d;
   border-color: rgba(255,31,61,0.3);
   background: rgba(255,31,61,0.08);
}

.item-actions {
   display: flex;
   gap: 8px;
}

.icon-btn {
   width: 40px;
   height: 40px;
   border-radius: 10px;
   background: #0d0d0d;
   border: 1px solid #252525;
   color: #bbb;
   font-size: 15px;
   display: flex;
   align-items: center;
   justify-content: center;
   cursor: pointer;
   transition: all 0.2s;
   flex-shrink: 0;
}

.icon-btn:active { transform: scale(0.92); }

.icon-btn.edit:active {
   background: rgba(0,123,255,0.15);
   border-color: #007bff;
   color: #007bff;
}

.icon-btn.del:active {
   background: rgba(255,31,61,0.15);
   border-color: #ff1f3d;
   color: #ff1f3d;
}

.icon-btn.toggle.active {
   background: rgba(0,255,136,0.12);
   border-color: rgba(0,255,136,0.4);
   color: #00ff88;
}

.icon-btn.toggle:not(.active) {
   background: rgba(255,31,61,0.12);
   border-color: rgba(255,31,61,0.4);
   color: #ff1f3d;
}

/* Empty state */
.empty {
   text-align: center;
   padding: 40px 20px;
   color: #555;
   font-size: 13px;
   letter-spacing: 1px;
}

.empty-icon {
   font-size: 40px;
   margin-bottom: 12px;
   opacity: 0.4;
}

/* Toast */
.toast {
   position: fixed;
   top: 20px;
   left: 50%;
   transform: translateX(-50%) translateY(-100px);
   background: #0d0d0d;
   border: 1px solid #1f1f1f;
   border-radius: 12px;
   padding: 12px 20px;
   font-size: 13px;
   font-weight: 600;
   color: #fff;
   box-shadow: 0 10px 40px rgba(0,0,0,0.7);
   z-index: 9999;
   transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
   display: flex;
   align-items: center;
   gap: 10px;
   max-width: 90%;
}

.toast.show {
   transform: translateX(-50%) translateY(0);
}

.toast.success { border-color: rgba(0,255,136,0.4); }
.toast.success .t-icon { color: #00ff88; }
.toast.error { border-color: rgba(255,31,61,0.4); }
.toast.error .t-icon { color: #ff1f3d; }
.toast.info .t-icon { color: #007bff; }

.t-icon {
   font-size: 16px;
   font-weight: 700;
}

/* Loading */
.loading-screen {
   display: flex;
   align-items: center;
   justify-content: center;
   padding: 40px;
   color: #555;
   font-size: 13px;
   letter-spacing: 1px;
}

.spinner {
   width: 22px;
   height: 22px;
   border: 2px solid #1f1f1f;
   border-top-color: #ff1f3d;
   border-radius: 50%;
   animation: spin 0.8s linear infinite;
   margin-right: 10px;
}

@keyframes spin {
   to { transform: rotate(360deg); }
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<!-- Header -->
<div class="header">
   <h1>GHOST <span>X</span> ADMIN</h1>
   <p>Control Panel</p>
   <div class="status-bar" id="statusBar">
      <div class="dot"></div>
      <span id="statusText">CONNECTING...</span>
   </div>
</div>

<!-- Form Card -->
<div class="card">
   <div class="card-title" id="formTitle">ADD NEW BUTTON</div>

   <input type="hidden" id="editKey" value="">

   <div class="field">
      <label>Button Name</label>
      <input type="text" id="inputName" placeholder="e.g. AIM ESP, WALLHACK..." autocomplete="off">
   </div>

   <div class="field-row">
      <div class="field">
         <label>Index (Native ID)</label>
         <input type="number" id="inputIndex" placeholder="0" min="0" inputmode="numeric">
      </div>
      <div class="field">
         <label>Type</label>
         <select id="inputType">
            <option value="toggle">Toggle</option>
            <option value="color">Color</option>
         </select>
      </div>
   </div>

   <div class="field">
      <label>Status</label>
      <select id="inputActive">
         <option value="true">Active (Visible in app)</option>
         <option value="false">Inactive (Hidden)</option>
      </select>
   </div>

   <button class="btn btn-primary" id="submitBtn" onclick="saveButton()">
      ＋ ADD BUTTON
   </button>

   <button class="btn btn-ghost" id="cancelBtn" onclick="cancelEdit()" style="display:none; margin-top: 8px;">
      ✕ CANCEL EDIT
   </button>
</div>

<!-- List Card -->
<div class="card">
   <div class="list-header">
      <div class="card-title" style="margin-bottom: 0;">MANAGE BUTTONS</div>
      <div class="count-badge" id="countBadge">0</div>
   </div>

   <div id="listContainer">
      <div class="loading-screen">
         <div class="spinner"></div>
         Loading...
      </div>
   </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
   <span class="t-icon" id="toastIcon">✓</span>
   <span id="toastMsg">Saved!</span>
</div>

<script>
/* ============ FIREBASE INIT (same as app) ============ */
firebase.initializeApp({
   apiKey: "AIzaSyBPS1l16CpDxNLqdJ4MUjXEu9vffmEvzIo",
   authDomain: "neamot-yt.firebaseapp.com",
   databaseURL: "https://neamot-yt-default-rtdb.firebaseio.com",
   projectId: "neamot-yt",
   storageBucket: "neamot-yt.firebasestorage.app",
   messagingSenderId: "364534257748",
   appId: "1:364534257748:android:31f228c13fa6cb903075c1"
});

const db = firebase.database();
const btnRef = db.ref("panel_buttons");

/* ============ NETWORK STATUS ============ */
function updateNetworkStatus() {
   const bar = document.getElementById('statusBar');
   const txt = document.getElementById('statusText');
   if (navigator.onLine) {
      bar.classList.remove('offline');
      txt.innerText = 'CONNECTED';
   } else {
      bar.classList.add('offline');
      txt.innerText = 'OFFLINE';
   }
}
window.addEventListener('online', updateNetworkStatus);
window.addEventListener('offline', updateNetworkStatus);
updateNetworkStatus();

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg, type = 'success') {
   const t = document.getElementById('toast');
   const icon = document.getElementById('toastIcon');
   const msgEl = document.getElementById('toastMsg');

   t.className = 'toast ' + type;
   icon.innerText = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
   msgEl.innerText = msg;

   t.classList.add('show');
   clearTimeout(toastTimer);
   toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ SAVE (ADD / UPDATE) ============ */
function saveButton() {
   const key = document.getElementById('editKey').value.trim();
   const name = document.getElementById('inputName').value.trim();
   const idxRaw = document.getElementById('inputIndex').value.trim();
   const type = document.getElementById('inputType').value;
   const active = document.getElementById('inputActive').value === 'true';

   if (!name) {
      showToast('Button name required!', 'error');
      document.getElementById('inputName').focus();
      return;
   }

   const index = idxRaw === '' ? 0 : parseInt(idxRaw, 10);
   if (isNaN(index) || index < 0) {
      showToast('Valid index required!', 'error');
      return;
   }

   const data = { name, index, type, active };

   if (key) {
      // update
      btnRef.child(key).update(data)
         .then(() => {
            showToast('Updated: ' + name, 'success');
            cancelEdit();
         })
         .catch(err => showToast('Error: ' + err.message, 'error'));
   } else {
      // add new
      btnRef.push(data)
         .then(() => {
            showToast('Added: ' + name, 'success');
            resetForm();
         })
         .catch(err => showToast('Error: ' + err.message, 'error'));
   }
}

/* ============ EDIT ============ */
function editButton(key, data) {
   document.getElementById('editKey').value = key;
   document.getElementById('inputName').value = data.name || '';
   document.getElementById('inputIndex').value = data.index != null ? data.index : 0;
   document.getElementById('inputType').value = data.type || 'toggle';
   document.getElementById('inputActive').value = data.active === false ? 'false' : 'true';

   document.getElementById('formTitle').innerText = 'EDIT BUTTON';
   document.getElementById('submitBtn').innerHTML = '✓ UPDATE BUTTON';
   document.getElementById('cancelBtn').style.display = 'flex';

   window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
   resetForm();
   window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
   document.getElementById('editKey').value = '';
   document.getElementById('inputName').value = '';
   document.getElementById('inputIndex').value = '';
   document.getElementById('inputType').value = 'toggle';
   document.getElementById('inputActive').value = 'true';

   document.getElementById('formTitle').innerText = 'ADD NEW BUTTON';
   document.getElementById('submitBtn').innerHTML = '＋ ADD BUTTON';
   document.getElementById('cancelBtn').style.display = 'none';
}

/* ============ DELETE ============ */
function deleteButton(key, name) {
   if (!confirm(`"${name}" ডিলিট করবেন?`)) return;
   btnRef.child(key).remove()
      .then(() => showToast('Deleted: ' + name, 'success'))
      .catch(err => showToast('Error: ' + err.message, 'error'));
}

/* ============ TOGGLE ACTIVE ============ */
function toggleActive(key, current) {
   btnRef.child(key).update({ active: !current })
      .then(() => showToast(current ? 'Deactivated' : 'Activated', 'info'))
      .catch(err => showToast('Error: ' + err.message, 'error'));
}

/* ============ RENDER LIST (REAL-TIME) ============ */
btnRef.on('value', (snapshot) => {
   const container = document.getElementById('listContainer');
   const badge = document.getElementById('countBadge');

   if (!snapshot.exists()) {
      container.innerHTML = `
         <div class="empty">
            <div class="empty-icon">📭</div>
            <div>No buttons yet</div>
            <div style="font-size:11px; margin-top:6px; color:#444;">Add your first button above</div>
         </div>`;
      badge.innerText = '0';
      return;
   }

   const items = [];
   snapshot.forEach((child) => {
      items.push({ key: child.key, ...child.val() });
   });

   // sort by index
   items.sort((a, b) => (a.index || 0) - (b.index || 0));

   badge.innerText = items.length;

   let html = '';
   items.forEach((it) => {
      const isActive = it.active !== false;
      const name = escapeHtml(it.name || 'Untitled');
      const index = it.index != null ? it.index : 0;
      const type = it.type || 'toggle';

      html += `
         <div class="item ${isActive ? '' : 'inactive'}">
            <div class="item-top">
               <div class="item-info">
                  <div class="item-name">${name}</div>
                  <div class="item-meta">
                     <span class="tag">IDX ${index}</span>
                     <span class="tag ${type === 'color' ? 'color-tag' : ''}">${type}</span>
                     <span class="tag ${isActive ? 'active-tag' : 'inactive-tag'}">
                        ${isActive ? 'ACTIVE' : 'INACTIVE'}
                     </span>
                  </div>
               </div>
            </div>
            <div class="item-actions">
               <button class="icon-btn toggle ${isActive ? 'active' : ''}"
                  onclick="toggleActive('${it.key}', ${isActive})" title="Toggle">
                  ${isActive ? '👁' : '🚫'}
               </button>
               <button class="icon-btn edit"
                  onclick='editButton(${JSON.stringify(it.key)}, ${JSON.stringify({name: it.name, index: it.index, type: it.type, active: it.active})})'
                  title="Edit">✎</button>
               <button class="icon-btn del"
                  onclick='deleteButton(${JSON.stringify(it.key)}, ${JSON.stringify(it.name || "")})'
                  title="Delete">🗑</button>
            </div>
         </div>`;
   });

   container.innerHTML = html;
}, (err) => {
   document.getElementById('listContainer').innerHTML = `
      <div class="empty">
         <div class="empty-icon">⚠</div>
         <div>Error: ${err.message}</div>
      </div>`;
});

/* ============ HELPERS ============ */
function escapeHtml(s) {
   return String(s).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
   }[m]));
}
</script>

</body>
</html>
